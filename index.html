<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Import Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bentham&family=Lugrasimo&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyara Restaurant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="nav-container">
            <h1 class="menu-items">Lugrasimo Font</h1>
            <p class="menu-items">Bentham Font</p>
            <i class="fa-solid fa-cart-shopping"></i>
        </nav>
    </header>
    <main>
        <section>
            <div class="flex-container">
                <div class="flex-item">
                    <img src="images/product1.png" alt="Image 1">
                    <h3 class="lugrasimo-regular">The Famous Ezma</h3>
                    <p class="bentham-regular">85 dkk</p>
                </div>
                <div class="flex-item">
                    <img src="images/product2.png" alt="Image 2">
                    <h3 class="lugrasimo-regular">Our Lentil Soup</h3>
                    <p class="bentham-regular">85 dkk</p>
                </div>
                <div class="flex-item">
                    <img src="images/product3.png" alt="Image 3">
                    <h3 class="lugrasimo-regular">Grilled Lamb Roll</h3>
                    <p class="bentham-regular">85 dkk</p>
                </div>
                <div class="flex-item">
                    <img src="images/product4.png" alt="Image 4">
                    <h3 class="lugrasimo-regular">Fried Feta Rolls</h3>
                    <p class="bentham-regular">85 dkk</p>
                </div>
            </div>
        </section>
    </main>
    <footer>
    </footer>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/fcdc3cd816.js" crossorigin="anonymous"></script>
</body>
</html>
