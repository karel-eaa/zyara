<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Import Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bentham&family=Lugrasimo&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarya Basket</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/fcdc3cd816.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav class="nav-container">
            <div class="nav-content basket-nav">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i></a>
                <div class="title-wrapper">
                    <h1 class="menu-items lugrasimo-regular kid">Zyara Restaurant</h1>
                </div>
                <div style="width: 62px;"></div>
            </div>
        </nav>
    </header>
    <main>
        <div class="single-row-container">
            <!-- Cart items will be dynamically loaded here -->
        </div>
    </main>
    <div class="basket-footer">
        <div class="total-section">
            <span class="total-label">Total</span>
            <span class="total-price">0 dkk</span>
        </div>
        <button class="checkout-btn">
            Checkout
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>
    
    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
